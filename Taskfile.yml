# Taskfile for RDD (Roadmap Driven Development)
# https://taskfile.dev/

version: '3'

vars:
  RDD_DIR: .rdd
  DOCS_DIR: docs
  STAGES_DIR: docs/stages
  HANDOFF_DIR: docs/handoff
  MIN_COVERAGE: 20

env:
  RDD_PROJECT_DIR:
    sh: pwd

tasks:
  # Default task - show available tasks
  default:
    desc: Show available tasks and project status
    cmds:
      - echo "RDD Taskfile - Available Commands"
      - echo "================================"
      - task --list
      - echo ""
      - echo "Quick Start:"
      - echo "  task bootstrap    - Initialize RDD project"
      - echo "  task doctor       - Diagnose project health"
      - echo "  task stage:gate   - Check all gate requirements"

  # ===========================================
  # Bootstrap & Initialization
  # ===========================================

  bootstrap:
    desc: Initialize RDD project structure and dependencies
    summary: |
      Initialize the RDD project structure by creating necessary directories,
      configuration files, and documentation templates.
    cmds:
      - echo "Initializing RDD project structure..."
      - mkdir -p {{.RDD_DIR}}/cache
      - mkdir -p {{.DOCS_DIR}}/stages
      - mkdir -p {{.DOCS_DIR}}/framework
      - mkdir -p {{.DOCS_DIR}}/handoff
      - echo "Checking configuration files..."
      - 'test -f {{.RDD_DIR}}/config.yml || echo "Warning: {{.RDD_DIR}}/config.yml not found"'
      - 'test -f {{.RDD_DIR}}/hooks.yml || echo "Warning: {{.RDD_DIR}}/hooks.yml not found"'
      - 'test -f {{.RDD_DIR}}/templates.yml || echo "Warning: {{.RDD_DIR}}/templates.yml not found"'
      - 'test -f {{.RDD_DIR}}/checkpoints.yml || echo "Warning: {{.RDD_DIR}}/checkpoints.yml not found"'
      - echo "Checking core documentation..."
      - 'test -f AGENTS.md || echo "Warning: AGENTS.md not found"'
      - 'test -f CLAUDE.md || echo "Warning: CLAUDE.md not found"'
      - 'test -f CHANGELOG.md || echo "Warning: CHANGELOG.md not found"'
      - echo "Checking stage documents..."
      - 'test -f {{.STAGES_DIR}}/stage-roadmap.md || echo "Warning: stage-roadmap.md not found"'
      - echo "RDD project structure initialized."
    silent: false

  # ===========================================
  # Diagnostics
  # ===========================================

  doctor:
    desc: Diagnose RDD project health
    summary: |
      Run comprehensive diagnostics on the RDD project to identify issues,
      missing files, and configuration problems.
    cmds:
      - echo "RDD Project Health Check"
      - echo "========================"
      - echo ""
      - echo "[1/6] Checking directory structure..."
      - 'test -d {{.RDD_DIR}} && echo "  [OK] .rdd directory exists" || echo "  [FAIL] .rdd directory missing"'
      - 'test -d {{.DOCS_DIR}} && echo "  [OK] docs directory exists" || echo "  [FAIL] docs directory missing"'
      - 'test -d {{.STAGES_DIR}} && echo "  [OK] docs/stages directory exists" || echo "  [FAIL] docs/stages directory missing"'
      - 'test -d {{.HANDOFF_DIR}} && echo "  [OK] docs/handoff directory exists" || echo "  [FAIL] docs/handoff directory missing"'
      - echo ""
      - echo "[2/6] Checking core configuration..."
      - 'test -f {{.RDD_DIR}}/config.yml && echo "  [OK] config.yml exists" || echo "  [FAIL] config.yml missing"'
      - 'test -f {{.RDD_DIR}}/hooks.yml && echo "  [OK] hooks.yml exists" || echo "  [WARN] hooks.yml missing (hooks disabled)"'
      - 'test -f {{.RDD_DIR}}/templates.yml && echo "  [OK] templates.yml exists" || echo "  [WARN] templates.yml missing"'
      - 'test -f {{.RDD_DIR}}/checkpoints.yml && echo "  [OK] checkpoints.yml exists" || echo "  [WARN] checkpoints.yml missing"'
      - echo ""
      - echo "[3/6] Checking agent entry points..."
      - 'test -f AGENTS.md && echo "  [OK] AGENTS.md exists" || echo "  [FAIL] AGENTS.md missing"'
      - 'test -f CLAUDE.md && echo "  [OK] CLAUDE.md exists" || echo "  [FAIL] CLAUDE.md missing"'
      - 'test -f Taskfile.yml && echo "  [OK] Taskfile.yml exists" || echo "  [FAIL] Taskfile.yml missing"'
      - echo ""
      - echo "[4/6] Checking documentation..."
      - 'test -f CHANGELOG.md && echo "  [OK] CHANGELOG.md exists" || echo "  [WARN] CHANGELOG.md missing"'
      - 'test -f {{.DOCS_DIR}}/01-charter.md && echo "  [OK] 01-charter.md exists" || echo "  [WARN] 01-charter.md missing"'
      - 'test -f {{.DOCS_DIR}}/02-engineering-principles.md && echo "  [OK] 02-engineering-principles.md exists" || echo "  [WARN] 02-engineering-principles.md missing"'
      - 'test -f {{.DOCS_DIR}}/03-stage-based-development.md && echo "  [OK] 03-stage-based-development.md exists" || echo "  [WARN] 03-stage-based-development.md missing"'
      - 'test -f {{.DOCS_DIR}}/08-autonomous-decisions.md && echo "  [OK] 08-autonomous-decisions.md exists" || echo "  [WARN] 08-autonomous-decisions.md missing"'
      - 'test -f {{.DOCS_DIR}}/10-review-practices.md && echo "  [OK] 10-review-practices.md exists" || echo "  [WARN] 10-review-practices.md missing"'
      - 'test -f {{.DOCS_DIR}}/11-next-steps.md && echo "  [OK] 11-next-steps.md exists" || echo "  [WARN] 11-next-steps.md missing"'
      - 'test -f {{.DOCS_DIR}}/12-technical-debt.md && echo "  [OK] 12-technical-debt.md exists" || echo "  [WARN] 12-technical-debt.md missing"'
      - echo ""
      - echo "[5/6] Checking stage documents..."
      - 'test -f {{.STAGES_DIR}}/stage-roadmap.md && echo "  [OK] stage-roadmap.md exists" || echo "  [FAIL] stage-roadmap.md missing"'
      - echo ""
      - echo "[6/6] Checking git status..."
      - 'git rev-parse --is-inside-work-tree > /dev/null 2>&1 && echo "  [OK] Git repository detected" || echo "  [WARN] Not a git repository"'
      - echo ""
      - echo "Health check complete."
    silent: false

  # ===========================================
  # Stage Management
  # ===========================================

  stage:verify:
    desc: Verify current stage completion criteria
    summary: |
      Verify that all completion criteria for the current stage are met.
      Checks documentation, tests, and gate requirements.
    cmds:
      - echo "Verifying current stage completion criteria..."
      - echo ""
      - echo "Checking for current stage document..."
      - sh -c 'ls {{.STAGES_DIR}}/stage-*.md 2>/dev/null | head -5 || echo "No stage documents found"'
      - echo ""
      - echo "Running gate checks..."
      - task gate:1
      - task gate:2
      - task gate:3
      - task gate:4
      - task gate:5
    silent: false

  stage:gate:
    desc: Check all gate requirements
    summary: |
      Run all five gate checks in sequence to validate stage completion.
      Gates: 1-Design Doc, 2-Design Review, 3-Implementation, 4-Code Review, 5-Completion.
    deps:
      - gate:1
      - gate:2
      - gate:3
      - gate:4
      - gate:5
    cmds:
      - echo ""
      - echo "All gate checks completed."
      - echo "Review the output above for any failures."
    silent: false

  stages:archive:
    desc: Archive old stage documents, keeping the 5 most recent completed stages
    summary: |
      Archive stage-N.md files older than the 5 most recent completed stages
      to docs/stages/archived/. Keeps incomplete stages regardless of count.
      Only pure numeric stage-N.md files are moved; other files are untouched.
      Usage: task stages:archive [-- --dry-run] [-- --keep N]
    cmds:
      - bash {{.RDD_DIR}}/scripts/stages-archive.sh {{.CLI_ARGS}}
    silent: false

  stages:archive:dry-run:
    desc: Preview archive without making changes
    summary: |
      Dry-run mode for stages:archive. Shows what would be moved
      without actually moving anything.
    cmds:
      - bash {{.RDD_DIR}}/scripts/stages-archive.sh --dry-run {{.CLI_ARGS}}
    silent: false

  # ===========================================
  # Individual Gate Checks
  # ===========================================

  gate:1:
    desc: Gate 1 - Design document check
    summary: |
      Gate 1: Verify design document completeness.
      Checks: design doc exists, goals defined, non-goals stated, acceptance criteria testable, rollback plan exists.
    cmds:
      - 'echo "Gate 1: Design Document Check"'
      - 'echo "------------------------------"'
      - 'echo "[ ] Design document is complete"'
      - 'echo "[ ] Goals are clearly defined"'
      - 'echo "[ ] Non-goals are explicitly stated"'
      - 'echo "[ ] Acceptance criteria are testable"'
      - 'echo "[ ] Rollback plan exists"'
      - echo ""
      - echo "Manual verification required. Check stage document for details."
    silent: false

  gate:2:
    desc: Gate 2 - Design review check
    summary: |
      Gate 2: Verify design review has been completed.
      Checks: multi-model review triggered, AI pre-filtering done, high-confidence findings resolved.
    cmds:
      - 'echo "Gate 2: Design Review Check"'
      - 'echo "---------------------------"'
      - 'echo "[ ] Multi-model review has been triggered"'
      - 'echo "[ ] AI pre-filtering completed"'
      - 'echo "[ ] High-confidence findings resolved"'
      - echo ""
      - echo "Check docs/stages/stage-N-review-log.md for review details."
    silent: false

  gate:3:
    desc: Gate 3 - Implementation and testing (REAL EXECUTION)
    summary: |
      Gate 3: Verify implementation and testing completeness.
      Runs actual test/lint/format checks. Non-zero exit blocks progression.
    cmds:
      - 'echo "Gate 3: Implementation & Testing (Hardened)"'
      - 'echo "--------------------------------------------"'
      - 'echo "[1/5] Running unit tests..."'
      - 'task test:unit || (echo "  [FAIL] Unit tests failed - gate blocked" && exit 1)'
      - 'echo "  [PASS] Unit tests passed"'
      - 'echo "[2/5] Running E2E tests..."'
      - 'task test:e2e || (echo "  [FAIL] E2E tests failed - gate blocked" && exit 1)'
      - 'echo "  [PASS] E2E tests passed"'
      - 'echo "[3/5] Checking test coverage..."'
      - 'task test:coverage || (echo "  [FAIL] Coverage below threshold - gate blocked" && exit 1)'
      - 'echo "  [PASS] Coverage meets threshold"'
      - 'echo "[4/5] Running lint checks..."'
      - 'task lint:check || (echo "  [FAIL] Lint violations - gate blocked" && exit 1)'
      - 'echo "  [PASS] Lint check passed"'
      - 'echo "[5/5] Running format checks..."'
      - 'task fmt:check || (echo "  [FAIL] Format violations - gate blocked" && exit 1)'
      - 'echo "  [PASS] Format check passed"'
      - 'echo ""'
      - 'echo "Gate 3: ALL CHECKS PASSED"'
    silent: false

  gate:4:
    desc: Gate 4 - Code review check
    summary: |
      Gate 4: Verify code review has been completed.
      Checks: triangulation complete, blocking findings resolved, acceptance criteria met.
    cmds:
      - 'echo "Gate 4: Code Review Check"'
      - 'echo "-------------------------"'
      - 'echo "[ ] Triangulation complete: main dev + independent reviewer + rule check"'
      - 'echo "[ ] All blocking findings resolved"'
      - 'echo "[ ] All acceptance criteria met"'
      - echo ""
      - echo "Check docs/stages/stage-N-review-log.md for review findings."
    silent: false

  gate:5:
    desc: Gate 5 - Completion gate check
    summary: |
      Gate 5: Final completion gate verification.
      Checks: hypotheses verified, tests reproducible, no undocumented steps, implementation matches design, tech debt updated, ADR recorded, fresh-agent-check passed.
    cmds:
      - 'echo "Gate 5: Completion Gate Check"'
      - 'echo "-----------------------------"'
      - 'echo "[ ] Main hypotheses verified or falsified"'
      - 'echo "[ ] Tests are reproducible via Task entry point"'
      - 'echo "[ ] No undocumented manual steps"'
      - 'echo "[ ] Implementation matches design (differences documented)"'
      - 'echo "[ ] New capabilities have CLI subcommands (if applicable)"'
      - 'echo "[ ] Tech debt ledger updated"'
      - 'echo "[ ] ADR recorded (Impact on subsequent Stages MUST NOT be empty)"'
      - 'echo "[ ] fresh-agent-check passed"'
      - echo ""
      - echo "Run 'task docs:fresh-check' to verify fresh agent can continue."
    silent: false

  # ===========================================
  # Handoff
  # ===========================================

  handoff:pack:
    desc: Generate handoff package for context transfer
    summary: |
      Generate a handoff package containing all necessary context for
      transferring the project to another agent or developer.
    cmds:
      - echo "Generating handoff package..."
      - mkdir -p {{.HANDOFF_DIR}}
      - echo "Creating handoff context..."
      - |
        HANDOFF_FILE="{{.HANDOFF_DIR}}/handoff-$(date +%Y%m%d-%H%M%S).md"
        echo "# RDD Handoff Package" > "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "Generated: $(date)" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Current Progress" >> "$HANDOFF_FILE"
        echo "- Stage: [Check docs/11-next-steps.md]" >> "$HANDOFF_FILE"
        echo "- Progress Percentage: [Update manually]" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Completed Evidence" >> "$HANDOFF_FILE"
        echo "- [Link to completed work]" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Blockers and Risks" >> "$HANDOFF_FILE"
        echo "- [List any blockers]" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Next Single Action" >> "$HANDOFF_FILE"
        echo "- [Specific next action]" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Degradation Strategy" >> "$HANDOFF_FILE"
        echo "If no progress in 30 minutes, trigger [degradation strategy]" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Key Files to Read" >> "$HANDOFF_FILE"
        echo "1. docs/11-next-steps.md - Current status" >> "$HANDOFF_FILE"
        echo "2. docs/01-charter.md - Project vision" >> "$HANDOFF_FILE"
        echo "3. docs/08-autonomous-decisions.md - Key decisions" >> "$HANDOFF_FILE"
        echo "4. docs/12-technical-debt.md - Known issues" >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "## Quick Start Commands" >> "$HANDOFF_FILE"
        echo '```bash' >> "$HANDOFF_FILE"
        echo "task doctor        # Check project health" >> "$HANDOFF_FILE"
        echo "task test          # Run tests" >> "$HANDOFF_FILE"
        echo "task stage:gate    # Run all gate checks" >> "$HANDOFF_FILE"
        echo '```' >> "$HANDOFF_FILE"
        echo "" >> "$HANDOFF_FILE"
        echo "Handoff package created: $HANDOFF_FILE"
    silent: false

  # ===========================================
  # Quick Checks
  # ===========================================

  check:
    desc: Run quick checks (docs, format, etc.)
    summary: |
      Run quick validation checks including documentation completeness,
      file formatting, and basic project structure.
    cmds:
      - echo "Running quick checks..."
      - echo ""
      - echo "[1/4] Checking documentation structure..."
      - 'test -f AGENTS.md && echo "  [OK] AGENTS.md" || echo "  [FAIL] AGENTS.md missing"'
      - 'test -f CLAUDE.md && echo "  [OK] CLAUDE.md" || echo "  [FAIL] CLAUDE.md missing"'
      - 'test -f CHANGELOG.md && echo "  [OK] CHANGELOG.md" || echo "  [WARN] CHANGELOG.md missing"'
      - echo ""
      - echo "[2/4] Checking for required documents..."
      - 'test -f {{.DOCS_DIR}}/11-next-steps.md && echo "  [OK] next-steps.md" || echo "  [WARN] next-steps.md missing"'
      - 'test -f {{.DOCS_DIR}}/01-charter.md && echo "  [OK] charter.md" || echo "  [WARN] charter.md missing"'
      - echo ""
      - echo "[3/4] Checking for stage documents..."
      - sh -c 'ls {{.STAGES_DIR}}/stage-*.md 2>/dev/null | wc -l | xargs -I {} echo "  [INFO] {} stage documents found"'
      - echo ""
      - echo "[4/4] Checking tech debt ledger..."
      - 'test -f {{.DOCS_DIR}}/12-technical-debt.md && echo "  [OK] technical-debt.md" || echo "  [WARN] technical-debt.md missing"'
      - echo ""
      - echo "Quick check complete."
    silent: false

  # ===========================================
  # Testing
  # ===========================================

  test:
    desc: Run all tests
    summary: |
      Run all test suites including unit tests and E2E tests.
      Override with your project's test command.
    cmds:
      - echo "Running all tests..."
      - task test:unit
      - task test:e2e
    silent: false

  test:unit:
    desc: Run unit tests
    cmds:
      - echo "Running unit tests..."
      - bats tests/unit/*.bats
    silent: false

  test:bdd:
    desc: Run BDD tests
    summary: |
      Run BDD tests only.
      Override with your project's BDD test command.
    cmds:
      - echo "Running BDD tests..."
      - bats tests/bdd/*.bats
    silent: false

  test:e2e:
    desc: Run E2E tests
    summary: |
      Run end-to-end tests only.
      Override with your project's E2E test command.
    cmds:
      - echo "Running E2E tests..."
      - bats tests/e2e/*.bats
    silent: false

  test:coverage:
    desc: Generate test coverage report
    summary: |
      Generate test coverage report.
      Override with your project's coverage command.
    cmds:
      - echo "Generating test coverage report..."
      - bash tests/lib/coverage.sh
      - echo ""
      - 'echo "Minimum coverage requirement: {{.MIN_COVERAGE}}%"'
    silent: false

  # ===========================================
  # Documentation
  # ===========================================

  docs:fresh-check:
    desc: Verify fresh agent can understand project
    summary: |
      Verify that a fresh agent (with no prior context) can understand
      and continue work on this project by checking documentation completeness.
      Also known as fresh-agent-check.
    aliases:
      - fresh-agent-check
      - fresh-check
    cmds:
      - echo "Fresh Agent Check"
      - echo "================="
      - echo ""
      - echo "Simulating fresh agent reading project..."
      - echo ""
      - echo "[1/5] Checking entry point documents..."
      - 'test -f AGENTS.md && echo "  [OK] AGENTS.md - Agent entry point exists" || echo "  [FAIL] AGENTS.md missing - agents cannot find entry point"'
      - 'test -f CLAUDE.md && echo "  [OK] CLAUDE.md - Claude Code entry point exists" || echo "  [WARN] CLAUDE.md missing"'
      - echo ""
      - echo "[2/5] Checking status documents..."
      - 'test -f {{.DOCS_DIR}}/11-next-steps.md && echo "  [OK] next-steps.md - Current status available" || echo "  [FAIL] next-steps.md missing - agents cannot determine current status"'
      - 'test -f {{.STAGES_DIR}}/stage-roadmap.md && echo "  [OK] stage-roadmap.md - Roadmap available" || echo "  [WARN] stage-roadmap.md missing"'
      - echo ""
      - echo "[3/5] Checking knowledge documents..."
      - 'test -f {{.DOCS_DIR}}/01-charter.md && echo "  [OK] charter.md - Project vision available" || echo "  [WARN] charter.md missing"'
      - 'test -f {{.DOCS_DIR}}/08-autonomous-decisions.md && echo "  [OK] autonomous-decisions.md - ADR log available" || echo "  [WARN] autonomous-decisions.md missing"'
      - 'test -f {{.DOCS_DIR}}/12-technical-debt.md && echo "  [OK] technical-debt.md - Tech debt ledger available" || echo "  [WARN] technical-debt.md missing"'
      - echo ""
      - echo "[4/5] Checking methodology documents..."
      - 'test -f {{.DOCS_DIR}}/02-engineering-principles.md && echo "  [OK] engineering-principles.md" || echo "  [WARN] engineering-principles.md missing"'
      - 'test -f {{.DOCS_DIR}}/03-stage-based-development.md && echo "  [OK] stage-based-development.md" || echo "  [WARN] stage-based-development.md missing"'
      - 'test -f {{.DOCS_DIR}}/10-review-practices.md && echo "  [OK] review-practices.md" || echo "  [WARN] review-practices.md missing"'
      - echo ""
      - echo "[5/5] Checking for current stage document..."
      - 'sh -c ''ls {{.STAGES_DIR}}/stage-[0-9]*.md 2>/dev/null | head -1 | xargs -I {} echo "  [OK] Found stage document: {}"'' || echo "  [INFO] No numbered stage document found - may be initial setup"'
      - echo ""
      - echo "Fresh agent check complete."
      - echo ""
      - echo "If all checks pass, a fresh agent should be able to:"
      - echo "1. Read AGENTS.md for entry point"
      - echo "2. Read docs/11-next-steps.md for current status"
      - echo "3. Read docs/01-charter.md for project vision"
      - echo "4. Read current stage document for ongoing work"
      - echo "5. Run 'task test' to verify tests"
    silent: false

  # ===========================================
  # Gate Aliases (for convenience)
  # ===========================================

  gate-1:
    desc: Alias for gate:1
    aliases:
      - gate1
    deps:
      - gate:1

  gate-2:
    desc: Alias for gate:2
    aliases:
      - gate2
    deps:
      - gate:2

  gate-3:
    desc: Alias for gate:3
    aliases:
      - gate3
    deps:
      - gate:3

  gate-4:
    desc: Alias for gate:4
    aliases:
      - gate4
    deps:
      - gate:4

  gate-5:
    desc: Alias for gate:5
    aliases:
      - gate5
    deps:
      - gate:5

  gate-check:
    desc: Alias for stage:gate
    deps:
      - stage:gate

  # ===========================================
  # Utility Tasks
  # ===========================================

  clean:
    desc: Clean generated files and caches
    cmds:
      - echo "Cleaning generated files..."
      - rm -rf {{.RDD_DIR}}/cache/*
      - echo "Clean complete."
    silent: false

  status:
    desc: Show project status summary
    cmds:
      - echo "RDD Project Status"
      - echo "=================="
      - echo ""
      - 'test -f {{.DOCS_DIR}}/11-next-steps.md && cat {{.DOCS_DIR}}/11-next-steps.md || echo "Status file (docs/11-next-steps.md) not found"'
    silent: false

  roadmap:
    desc: Show project roadmap
    cmds:
      - echo "Project Roadmap"
      - echo "==============="
      - echo ""
      - 'test -f {{.STAGES_DIR}}/stage-roadmap.md && cat {{.STAGES_DIR}}/stage-roadmap.md || echo "Roadmap file (docs/stages/stage-roadmap.md) not found"'
    silent: false

  # ===========================================
  # Performance Benchmark Tasks (Stage 5)
  # ===========================================

  benchmark:
    desc: Run all performance benchmarks
    summary: |
      Run comprehensive performance benchmarks for RDD operations.
      Measures hook latency, notification latency, memory usage, and config loading.
    cmds:
      - bash {{.RDD_DIR}}/scripts/benchmark.sh all

  benchmark:hook:
    desc: Benchmark hook trigger latency
    summary: |
      Measure hook trigger latency (target: < 100ms P95).
    cmds:
      - bash {{.RDD_DIR}}/scripts/benchmark.sh hook

  benchmark:notification:
    desc: Benchmark notification sending latency
    summary: |
      Measure notification sending latency (target: < 500ms P95).
    cmds:
      - bash {{.RDD_DIR}}/scripts/benchmark.sh notification

  benchmark:memory:
    desc: Benchmark memory usage
    summary: |
      Measure memory usage in idle state (target: < 50MB).
    cmds:
      - bash {{.RDD_DIR}}/scripts/benchmark.sh memory

  benchmark:config:
    desc: Benchmark configuration loading
    summary: |
      Measure configuration file loading time.
    cmds:
      - bash {{.RDD_DIR}}/scripts/benchmark.sh config

  # ===========================================
  # Version Management Tasks (Stage 5)
  # ===========================================

  version:
    desc: Show current RDD version
    cmds:
      - bash {{.RDD_DIR}}/scripts/version.sh current

  version:check:
    desc: Check version compatibility
    summary: |
      Check if a version is compatible with current RDD.
      Use --version flag to specify version to check.
    cmds:
      - bash {{.RDD_DIR}}/scripts/version.sh check --version {{.VERSION | default "1.0.0"}}

  version:bump:
    desc: Bump version
    summary: |
      Bump version (major/minor/patch).
      Use --type flag to specify bump type.
    cmds:
      - bash {{.RDD_DIR}}/scripts/version.sh bump --type {{.TYPE | default "patch"}}

  version:matrix:
    desc: Show version compatibility matrix
    cmds:
      - bash {{.RDD_DIR}}/scripts/version.sh matrix

  # ===========================================
  # Migration Tasks (Stage 5)
  # ===========================================

  migrate:plan:
    desc: Plan migration to new version
    summary: |
      Generate migration plan without executing.
      Use --target flag to specify target version.
    cmds:
      - bash {{.RDD_DIR}}/scripts/migrate.sh plan --target {{.TARGET | default "latest"}}

  migrate:execute:
    desc: Execute migration to new version
    summary: |
      Execute migration to target version.
      Creates backup and runs migration scripts.
    cmds:
      - bash {{.RDD_DIR}}/scripts/migrate.sh execute --target {{.TARGET | default "latest"}}

  migrate:rollback:
    desc: Rollback to previous version
    summary: |
      Rollback to previous version using backup.
      Use --rollback flag to specify backup path.
    cmds:
      - bash {{.RDD_DIR}}/scripts/migrate.sh rollback

  migrate:status:
    desc: Show migration status
    cmds:
      - bash {{.RDD_DIR}}/scripts/migrate.sh status

  migrate:validate:
    desc: Validate migration prerequisites
    cmds:
      - bash {{.RDD_DIR}}/scripts/migrate.sh validate

  # ===========================================
  # Compatibility Tasks (Stage 5)
  # ===========================================

  compat:check:
    desc: Run compatibility check
    summary: |
      Run full compatibility check on all configuration files.
      Validates VERSION, config.yml, hooks.yml, and templates.yml.
    cmds:
      - bash {{.RDD_DIR}}/scripts/compat.sh check

  compat:validate:
    desc: Validate specific configuration file
    summary: |
      Validate a specific configuration file.
      Use --config flag to specify file path.
    cmds:
      - bash {{.RDD_DIR}}/scripts/compat.sh validate --config {{.CONFIG | default ".rdd/config.yml"}}

  compat:breaking:
    desc: Check for breaking changes
    summary: |
      Check for breaking changes between versions.
      Use --from and --to flags to specify versions.
    cmds:
      - bash {{.RDD_DIR}}/scripts/compat.sh breaking --from {{.FROM | default "0.9.0"}} --to {{.TO | default "1.0.0"}}

  compat:deprecations:
    desc: Show deprecation warnings
    cmds:
      - bash {{.RDD_DIR}}/scripts/compat.sh deprecations

  compat:fix:
    desc: Auto-fix compatibility issues
    summary: |
      Automatically fix compatibility issues.
      Creates missing configuration files with defaults.
    cmds:
      - bash {{.RDD_DIR}}/scripts/compat.sh fix

  # ===========================================
  # Context Recovery Tasks
  # ===========================================

  recovery:check:
    desc: Check if recovery is needed
    summary: |
      Check if a context recovery is needed after compact.
      Returns 'true' if recovery is needed, 'false' otherwise.
    cmds:
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh needs-recovery
    silent: false

  recovery:load:
    desc: Load checkpoint and handoff for recovery
    summary: |
      Load checkpoint state and display handoff document
      for context recovery after compact.
    cmds:
      - echo "Loading context recovery information..."
      - echo ""
      - echo "=== Checkpoint State ==="
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh load || echo "No checkpoint available"
      - echo ""
      - echo "=== Handoff Document ==="
      - bash {{.RDD_DIR}}/scripts/handoff.sh show || echo "No handoff document available"
      - echo ""
      - echo "Recovery information loaded."
      - echo "Please read the handoff document carefully before continuing."
    silent: false

  recovery:save:
    desc: Save checkpoint and generate handoff
    summary: |
      Save current checkpoint state and generate handoff document.
      Use this before ending a session or at regular intervals.
    cmds:
      - echo "Saving context recovery information..."
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh save
      - bash {{.RDD_DIR}}/scripts/handoff.sh generate manual "Manual save"
      - echo ""
      - echo "Context recovery information saved."
    silent: false

  recovery:clear:
    desc: Clear recovery state
    summary: |
      Clear checkpoint and handoff after successful recovery
      or when starting fresh.
    cmds:
      - echo "Clearing recovery state..."
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh clear
      - bash {{.RDD_DIR}}/scripts/handoff.sh clear
      - echo "Recovery state cleared."
    silent: false

  checkpoint:save:
    desc: Save checkpoint only
    cmds:
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh save
    silent: false

  checkpoint:show:
    desc: Show checkpoint state
    cmds:
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh show
    silent: false

  checkpoint:gate:
    desc: Update gate status
    summary: |
      Update gate status in checkpoint.
      Usage: task checkpoint:gate -- <gate_num> <status>
      gate_num: 1-5, status: pending/completed/failed/in_progress
    cmds:
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh gate {{.CLI_ARGS}}
    silent: false

  handoff:generate:
    desc: Generate handoff document
    summary: |
      Generate handoff document for context transfer.
      Usage: task handoff:generate -- [trigger] [reason]
      trigger: manual, gate_complete, decision, timer
    cmds:
      - bash {{.RDD_DIR}}/scripts/handoff.sh generate {{.CLI_ARGS}}
    silent: false

  handoff:show:
    desc: Show handoff document
    cmds:
      - bash {{.RDD_DIR}}/scripts/handoff.sh show
    silent: false

  handoff:validate:
    desc: Validate handoff document
    cmds:
      - bash {{.RDD_DIR}}/scripts/handoff.sh validate
    silent: false

  rdd:health:
    desc: Run comprehensive RDD health check
    summary: |
      Run comprehensive health check including structure, tests,
      and recovery state.
    cmds:
      - echo "RDD Health Check"
      - echo "================"
      - echo ""
      - task doctor
      - echo ""
      - echo "[Recovery State]"
      - bash {{.RDD_DIR}}/scripts/checkpoint.sh show || echo "No checkpoint found"
      - bash {{.RDD_DIR}}/scripts/handoff.sh validate || echo "No handoff found"
      - echo ""
      - echo "Health check complete."
    silent: false

  # ===========================================
  # Security Tasks (Stage 6)
  # ===========================================

  rdd:security-check:
    desc: Run security configuration check
    summary: |
      Run comprehensive security check on RDD configuration.
      Checks file permissions, credentials, RBAC, audit logging, and encryption.
    cmds:
      - bash {{.RDD_DIR}}/scripts/security-check.sh
    silent: false

  rdd:security-fix:
    desc: Run security check and auto-fix issues
    summary: |
      Run security check and automatically fix fixable issues.
      Sets correct permissions, generates encryption key, etc.
    cmds:
      - bash {{.RDD_DIR}}/scripts/security-check.sh --fix
    silent: false

  rdd:audit:
    desc: Show audit log status
    summary: |
      Display audit log status and recent entries.
    cmds:
      - bash {{.RDD_DIR}}/scripts/audit.sh status
    silent: false

  rdd:audit-query:
    desc: Query audit logs
    summary: |
      Query audit logs with optional filter.
      Usage: task rdd:audit-query -- <filter>
      Example: task rdd:audit-query -- "PERMISSION_DENIED"
    cmds:
      - bash {{.RDD_DIR}}/scripts/audit.sh query "{{.CLI_ARGS}}"
    silent: false

  rdd:audit-export:
    desc: Export audit logs
    summary: |
      Export audit logs to file.
      Usage: task rdd:audit-export -- <format> [output_file]
      Formats: json, csv, text
    cmds:
      - bash {{.RDD_DIR}}/scripts/audit.sh export {{.CLI_ARGS}}
    silent: false

  rdd:encrypt:
    desc: Encrypt sensitive data
    summary: |
      Encrypt a value using RDD encryption.
      Usage: task rdd:encrypt -- <value>
    cmds:
      - bash {{.RDD_DIR}}/lib/crypto.sh encrypt "{{.CLI_ARGS}}"
    silent: false

  rdd:decrypt:
    desc: Decrypt sensitive data
    summary: |
      Decrypt a value using RDD encryption.
      Usage: task rdd:decrypt -- <encrypted_value>
    cmds:
      - bash {{.RDD_DIR}}/lib/crypto.sh decrypt "{{.CLI_ARGS}}"
    silent: false

  # ===========================================
  # Backup & Restore Tasks (Stage 7)
  # ===========================================

  rdd:backup:
    desc: Create backup of RDD Framework data
    summary: |
      Create a backup of RDD Framework data including configuration,
      cache, logs, and documentation.
      Usage: task rdd:backup [--name NAME] [--output DIR]
    cmds:
      - bash {{.RDD_DIR}}/scripts/backup.sh {{.CLI_ARGS}}
    silent: false

  rdd:restore:
    desc: Restore RDD Framework from backup
    summary: |
      Restore RDD Framework from a backup file.
      Usage: task rdd:restore BACKUP_FILE=path/to/backup.tar.gz
      Options:
        --target DIR    Target directory (default: current)
        --force         Force restore even if version mismatch
        --dry-run       Show what would be restored
    cmds:
      - bash {{.RDD_DIR}}/scripts/restore.sh {{.CLI_ARGS}}
    silent: false

  rdd:backup-list:
    desc: List available backups
    summary: |
      List all available backups in the backup directory.
    cmds:
      - echo "Available Backups"
      - echo "================="
      - mkdir -p {{.RDD_DIR}}/backups
      - ls -lah {{.RDD_DIR}}/backups/ 2>/dev/null || echo "No backups found"
    silent: false

  # ===========================================
  # Multi-Project Tasks (Stage 7)
  # ===========================================

  rdd:projects:
    desc: List managed projects
    summary: List all projects managed by RDD Framework.
    cmds:
      - echo "Managed Projects"
      - echo "================"
      - test -f ~/.rdd/projects.yml && cat ~/.rdd/projects.yml || echo "No projects configured"
    silent: false

  rdd:project:
    desc: Switch to a project
    summary: Switch to a specific project by name.
    cmds:
      - cat ~/.rdd/projects.yml
    silent: false

  rdd:mask:
    desc: Mask sensitive value
    summary: |
      Mask a sensitive value for safe display.
      Usage: task rdd:mask -- <value> [type]
      Types: password, token, api_key, url, email
    cmds:
      - bash {{.RDD_DIR}}/lib/crypto.sh mask {{.CLI_ARGS}}
    silent: false

  rdd:permissions:
    desc: Show current user permissions
    summary: |
      Display the current user's role and permissions.
    cmds:
      - bash -c 'source {{.RDD_DIR}}/lib/permissions.sh && list_permissions'
    silent: false

  test:security:
    desc: Run security unit tests
    summary: |
      Run all security-related unit tests including permissions,
      audit, crypto, and security validation tests.
    cmds:
      - echo "Running security unit tests..."
      - bats tests/unit/permissions.bats tests/unit/audit.bats tests/unit/crypto.bats tests/unit/security.bats tests/unit/security-check.bats
    silent: false

  # ===========================================
  # Lint & Format
  # ===========================================

  lint:check:
    desc: Run lint checks (shellcheck for .sh, bats syntax for .bats)
    summary: |
      Run lint checks on all shell scripts and bats test files.
      Blocks on shellcheck errors (exit code 2). Warnings (exit 1) do not block.
    cmds:
      - 'echo "Running shellcheck on scripts (errors block, warnings pass)..."'
      - 'sc_exit=0; find . -name "*.sh" -not -path "./tests/lib/*" -print0 | xargs -0 shellcheck -x || sc_exit=$?; if [ "$sc_exit" = "2" ]; then echo "  [FAIL] Shell errors found - gate blocked"; exit 1; else echo "  [OK] No errors (warnings logged but non-blocking)"; fi'
      - 'echo "Checking bats test syntax..."'
      - 'find tests -name "*.bats" -not -path "*/lib/*" -print0 | xargs -0 -I {} sh -c "bats --formatter pretty --count {} > /dev/null 2>&1 || (echo Syntax error: {} && exit 1)"'
      - 'echo "Lint check complete."'
    silent: false

  fmt:check:
    desc: Check code formatting (shfmt for .sh)
    summary: |
      Check that all shell scripts follow consistent formatting.
      Uses shfmt with standard indentation.
    cmds:
      - echo "Checking shell script formatting..."
      - find . -name "*.sh" -not -path "./tests/lib/*" -print0 | xargs -0 shfmt -d -i 2 -ci
      - echo "Format check complete."
    silent: false

  fmt:fix:
    desc: Auto-fix code formatting (shfmt -w)
    cmds:
      - echo "Fixing shell script formatting..."
      - find . -name "*.sh" -not -path "./tests/lib/*" -print0 | xargs -0 shfmt -w -i 2 -ci
      - echo "Format fixed."
    silent: false

  # ===========================================
  # Bootstrap & Dependencies
  # ===========================================

  bootstrap:deps:
    desc: Install required development tools
    summary: |
      Check and install required development dependencies.
      Required: shellcheck, shfmt, yq.
    cmds:
      - 'echo "Checking required development tools..."'
      - 'which shellcheck || (echo "  [MISSING] shellcheck - install: brew install shellcheck" && exit 1)'
      - 'echo "  [OK] shellcheck"'
      - 'which shfmt || (echo "  [MISSING] shfmt - install: brew install shfmt" && exit 1)'
      - 'echo "  [OK] shfmt"'
      - 'which yq || (echo "  [MISSING] yq - install: brew install yq" && exit 1)'
      - 'echo "  [OK] yq"'
      - 'echo "All dependencies satisfied."'
    silent: false

  # ===========================================
  # Loop Operations (Stage 22)
  # ===========================================

  loop:detect:
    desc: Auto-detect incomplete stages from roadmap
    summary: |
      Scan stage-roadmap.md for incomplete stages, resolve dependency
      ordering, and display execution plan.
      Options: --from N --to M for range filtering.
    cmds:
      - bash {{.RDD_DIR}}/scripts/auto-detect.sh {{.CLI_ARGS}}
    silent: false

  loop:state:
    desc: Show loop execution state
    cmds:
      - bash {{.RDD_DIR}}/scripts/loop-persist.sh show
    silent: false

  loop:persist:
    desc: Save loop heartbeat snapshot
    cmds:
      - bash {{.RDD_DIR}}/scripts/loop-persist.sh heartbeat
    silent: false

  loop:dashboard:
    desc: Show multi-stage progress dashboard
    cmds:
      - bash {{.RDD_DIR}}/scripts/progress-dashboard.sh
    silent: false

  loop:recovery:
    desc: Check if loop recovery is needed
    cmds:
      - bash {{.RDD_DIR}}/scripts/loop-persist.sh needs-recovery
    silent: false

  pool:list:
    desc: List worktree pool status
    cmds:
      - bash {{.RDD_DIR}}/scripts/worktree-pool.sh list
    silent: false

  pool:cleanup:
    desc: Clean up all worktrees
    cmds:
      - bash {{.RDD_DIR}}/scripts/worktree-pool.sh cleanup
    silent: false

  health:check:
    desc: Run RDD framework health check
    cmds:
      - bash scripts/health.sh
    silent: false

  metrics:show:
    desc: Show RDD framework metrics
    cmds:
      - bash scripts/metrics.sh
    silent: false

  logger:test:
    desc: Test RDD logging system
    cmds:
      - bash scripts/logger.sh
    silent: false

  circuit:status:
    desc: Show circuit breaker status
    cmds:
      - bash {{.RDD_DIR}}/scripts/circuit_breaker.sh status
    silent: false

  notify:test:
    desc: Test notification system
    cmds:
      - bash {{.RDD_DIR}}/scripts/notify.sh test
    silent: false

  retry:test:
    desc: Test retry mechanism
    cmds:
      - bash {{.RDD_DIR}}/scripts/retry.sh --help
    silent: false

  scheduler:status:
    desc: Show subagent scheduler status
    cmds:
      - bash {{.RDD_DIR}}/scripts/subagent-scheduler.sh status
    silent: false

  scheduler:execute:
    desc: Execute stage via subagent scheduler
    cmds:
      - bash {{.RDD_DIR}}/scripts/subagent-scheduler.sh execute {{.CLI_ARGS}}
    silent: false

  registry:verify:
    desc: Check for orphan scripts not in Taskfile
    cmds:
      - bash {{.RDD_DIR}}/scripts/task-registry.sh verify
    silent: false

  registry:list:
    desc: List all script registration status
    cmds:
      - bash {{.RDD_DIR}}/scripts/task-registry.sh list-orphans
    silent: false
