# RDD Test Configuration Template
# Auto-generated by rdd-init with TDD/BDD setup

# Language and framework detection results
language: "{{LANGUAGE}}"
project_type: "{{PROJECT_TYPE}}"  # frontend, backend-api, backend-service, fullstack

# Test framework configuration
test_framework:
  # BDD Framework
  bdd: "{{BDD_FRAMEWORK}}"
  bdd_version: "{{BDD_VERSION}}"

  # Unit Test Runner
  unit: "{{UNIT_RUNNER}}"
  unit_version: "{{UNIT_VERSION}}"

  # Coverage Tool
  coverage: "{{COVERAGE_TOOL}}"

  # E2E Testing (optional)
  e2e: "{{E2E_TOOL}}"

  # API Testing (for backend projects)
  api: "{{API_TEST_TOOL}}"

# Coverage requirements
coverage:
  # Minimum coverage percentage (enforced in gates)
  minimum: 95

  # Fail gate if below minimum
  fail_gate: true

  # Coverage report format
  report_format: "{{COVERAGE_FORMAT}}"

  # Coverage output directory
  output_dir: "coverage"

  # Files to include
  include:
    - "src/**/*"
    - "lib/**/*"

  # Files to exclude
  exclude:
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/test/**"
    - "**/tests/**"

# Test directories
directories:
  features: "tests/features"      # BDD feature files
  steps: "tests/steps"            # BDD step definitions
  unit: "tests/unit"              # Unit tests
  integration: "tests/integration" # Integration tests
  e2e: "tests/e2e"                # E2E tests
  fixtures: "tests/fixtures"      # Test fixtures

# Test commands
commands:
  unit: "{{UNIT_COMMAND}}"
  e2e: "{{E2E_COMMAND}}"
  coverage: "{{COVERAGE_COMMAND}}"
  bdd: "{{BDD_COMMAND}}"
  all: "{{ALL_COMMAND}}"

# Pre-commit hooks
pre_commit:
  enabled: true
  run_unit_tests: true
  run_coverage_check: true
  run_lint: true
  minimum_coverage: 95

# CI/CD integration
ci:
  run_on_pr: true
  run_on_push: true
  fail_on_coverage_drop: true
  upload_coverage: false
  coverage_service: ""  # codecov, coveralls, etc.

# Example feature file template (generated)
example_feature: |
  Feature: Example feature
    As a developer
    I want to verify testing setup
    So that I can write BDD tests

    Scenario: Basic test execution
      Given the test framework is configured
      When I run the example test
      Then it should pass
