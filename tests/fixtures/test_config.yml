# Test configuration for unit tests
# This file provides a minimal configuration for testing

version: "1.0"

project:
  name: test-project
  description: "Test project for RDD Framework"

notifications:
  quiet_hours:
    enabled: false
    start: "22:00"
    end: "08:00"
    timezone: "Asia/Shanghai"
    bypass_for_p0: true

retry:
  max_attempts: 3
  initial_delay: "1s"
  max_delay: "30s"

triggers:
  stage_complete:
    enabled: true
    channels:
      - webhook
    priority: "P2"

  roadmap_change:
    enabled: true
    channels:
      - webhook
    priority: "P0"

  consecutive_failure:
    enabled: true
    channels:
      - webhook
    priority: "P0"

  hypothesis_invalid:
    enabled: true
    channels:
      - webhook
    priority: "P0"

  model_disagreement:
    enabled: true
    channels:
      - webhook
    priority: "P1"

  tech_debt_threshold:
    enabled: true
    channels:
      - webhook
    priority: "P1"

  daily_report:
    enabled: false
    channels:
      - webhook
    priority: "P3"

  weekly_report:
    enabled: false
    channels:
      - webhook
    priority: "P3"

channels:
  webhook:
    enabled: true
    url: "https://example.com/webhook"
    method: "POST"
    headers: ""

  wecom:
    enabled: false
    webhook_url: ""

  email:
    enabled: false
    smtp_host: ""
    smtp_port: "587"
    smtp_user: ""
    smtp_pass: ""
    from_address: ""
    to_addresses: []

  bark:
    enabled: false
    server_url: ""
    device_key: ""

  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
